spring:
  application:
    name: wish-list-project

  datasource:
    url: jdbc:h2:file:./data/wishlist;AUTO_SERVER=TRUE;CIPHER=AES
    username: sa
    # пароль состоит из двух частей: <db-user-password> <file-encryption-password>
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  h2:
    console:
      enabled: true
      path: /h2-console

#  в .env файле,
#или задавать через системную переменную среды (например в Linux: export DB_PASSWORD='dbpass secretkey').