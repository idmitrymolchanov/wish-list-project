spring:
  application:
    name: wish-list-project

  datasource:
    url: jdbc:h2:mem:wishlist
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    initialize-on-startup: false

  h2:
    console:
      enabled: true
      path: /h2-console

#  в .env файле,
#или задавать через системную переменную среды (например в Linux: export DB_PASSWORD='dbpass secretkey').